name: IQuit
options:
  bundleIdPrefix: com.iquit
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  IQuit:
    type: application
    platform: iOS
    sources:
      - path: IQuit
      - path: Shared
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iquit.ios
        PRODUCT_NAME: IQuit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_CFBundleDisplayName: "Не курю"
    info:
      path: Support/IQuit-Info.plist
      properties:
        CFBundleDisplayName: "Не курю"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleIconName: AppIcon
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleLocalizations:
          - en
          - ru
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSHumanReadableCopyright: "© 2026 I Quit"
    entitlements:
      path: Support/IQuit.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.iquit.ios
    dependencies:
      - target: IQuitWidgets
        embed: true
    scheme:
      testTargets:
        - IQuitTests
      gatherCoverageData: true

  IQuitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: IQuitWidgets
      - path: Shared
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iquit.ios.widgets
        PRODUCT_NAME: IQuitWidgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Support/IQuitWidgets-Info.plist
      properties:
        CFBundleDisplayName: "I Quit"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleLocalizations:
          - en
          - ru
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: "XPC!"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/IQuitWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.iquit.ios

  IQuitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IQuitTests
    dependencies:
      - target: IQuit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iquit.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IQuit.app/IQuit"
        BUNDLE_LOADER: "$(TEST_HOST)"
