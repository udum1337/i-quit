<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Интерактивный прототип приложения для отказа от никотина: стрик, таймлайн здоровья, экономия и достижения.">
  <title>Не курю / I Quit — интерактивный прототип</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <div class="stage">
    <header class="stage-bar">
      <div class="brand">
        <div class="logo" id="logo" aria-hidden="true"></div>
        <div class="brand-text">
          <div class="brand-title">
            <span id="brand-name">Не курю</span>
            <span class="badge" id="brand-badge">прототип</span>
          </div>
          <div class="brand-sub" id="brand-sub">iOS 17+ · SwiftUI · демо-данные</div>
        </div>
      </div>
      <div class="stage-controls">
        <div class="seg" aria-label="Language">
          <button type="button" data-action="set-lang" data-lang="ru" class="is-active">RU</button>
          <button type="button" data-action="set-lang" data-lang="en">EN</button>
        </div>
        <div class="seg" aria-label="Theme">
          <button type="button" data-action="set-theme" data-theme="light" class="is-active" aria-label="Light theme">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" data-action="set-theme" data-theme="dark" aria-label="Dark theme">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          </button>
        </div>
        <button type="button" class="btn-ghost" data-action="open-onboarding" id="btn-onboarding">Онбординг</button>
        <button type="button" class="btn-ghost" data-action="reset-demo" id="btn-reset">Сброс демо</button>
      </div>
    </header>

    <div class="phone-wrap" id="phone-wrap">
      <div class="phone" id="phone">
        <div class="dynamic-island" aria-hidden="true"></div>
        <div class="statusbar" aria-hidden="true">
          <span class="status-time">9:41</span>
          <span class="status-icons">
            <svg viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 16 12" width="16" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0 1 13 0"/><path d="M4 6.9a6 6 0 0 1 8 0"/><path d="M6.5 9.5a2.4 2.4 0 0 1 3 0"/></svg>
            <svg viewBox="0 0 26 12" width="26" height="12" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.6" fill="currentColor" stroke="none"/><path d="M23.5 4v4" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
        </div>

        <main class="app" id="app">
          <section class="screen" id="screen-home" data-screen="home"></section>
          <section class="screen" id="screen-timeline" data-screen="timeline"></section>
          <section class="screen" id="screen-progress" data-screen="progress"></section>
          <section class="screen" id="screen-settings" data-screen="settings"></section>
        </main>

        <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
        <div class="onboarding" id="onboarding" role="dialog" aria-modal="true" aria-labelledby="ob-title" aria-hidden="true"></div>
        <div class="sheet-backdrop" id="sheet-backdrop" data-action="close-sheet"></div>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true"></div>
        <div class="toast" id="toast" role="status"></div>
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>

    <footer class="stage-footer">
      <span id="footer-note">Данные демонстрационные. Не является медицинской рекомендацией.</span>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui-core.js"></script>
  <script src="js/ui-home.js"></script>
  <script src="js/ui-timeline.js"></script>
  <script src="js/ui-progress.js"></script>
  <script src="js/ui-settings.js"></script>
  <script src="js/ui-onboarding.js"></script>
  <script src="js/ui-sheet.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
